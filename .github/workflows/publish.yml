name: Publish to Instagram

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min; publish.py decides what is due
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state.json, not the commit that queued this run (prevents double posts)
      - name: Publish due items
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 publish.py
      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "instagram-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update publish state"
            git pull --rebase -q && git push
          fi
